[project]
name = "chimera"
version = "0.1.0"
description = "Mobile reverse engineering platform — many backends, one beast"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "r2pipe>=1.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "textual>=0.89",
    "mcp>=1.0",
    "yara-python>=4.5",
    "pefile>=2024.8.26",
    "pyelftools>=0.31",
]

[project.optional-dependencies]
# capa is heavyweight (vivisect, smda, networkx) and the pinned subdeps
# can clash with other tooling; install it separately when you want capa
# capabilities surfaced. Without it, the adapter degrades gracefully.
capa = [
    "flare-capa>=8.0",
]
# Dynamic instrumentation — needed for `chimera attach` and any Frida-
# driven workflow. Optional because frida-python pulls a per-platform
# wheel and we want CI / desktop installs to be lightweight by default.
dynamic = [
    "frida>=16.0",
]
# VarBERT (Pal et al., IEEE S&P 2024) variable-name recovery. Optional
# because the Transformer model weights are large and the binding pulls
# in torch; default installs skip it. Without this extra, the adapter's
# `is_available()` returns False and `chimera varbert rename` prints a
# clear "install with pip install chimera[varbert]" message.
varbert = [
    "varbert-api>=0.1",
]
# EMBER 2024 malware classifier (futurecomputing4ai/EMBER2024). LightGBM
# is the only required runtime; `ember` (PyPI: 'ember') gives the full
# 2381-dim feature vector while `lief` is needed for any PE parsing.
# Without these the classifier's is_available() is False.
ml = [
    "lightgbm>=4.0",
    "lief>=0.14",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "testcontainers[postgres]>=4.0",
]

[project.scripts]
chimera = "chimera.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chimera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
